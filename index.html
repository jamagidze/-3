<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apartment Hello</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="scene" aria-label="A boy on the street waving to a ginger girl in apartment 2">
        <div class="sky-glow"></div>

        <div class="building" aria-label="Nine-storey apartment building">
            <div class="roof"><span>9</span></div>

            <div class="floor"><div class="window"><i></i></div><div class="window dark"><i></i></div><div class="window"><i></i></div></div>
            <div class="floor second">
                <div class="window"><i></i></div>
                <div class="window apartment" aria-label="Apartment 2 with a ginger girl">
                    <div class="curtain left-curtain"></div>
                    <div class="curtain right-curtain"></div>
                    <div class="girl">
                        <div class="hair-back"></div>
                        <div class="head">
                            <span class="eye left-eye"></span>
                            <span class="eye right-eye"></span>
                            <span class="smile"></span>
                            <span class="freckles"></span>
                        </div>
                        <div class="ginger-hair"></div>
                        <div class="neck"></div>
                        <div class="torso"></div>
                        <div class="arm resting"></div>
                        <div class="arm waving">
                            <span class="forearm"><b class="hand"><em class="finger f1"></em><em class="finger f2"></em><em class="finger f3"></em><em class="finger f4"></em></b></span>
                        </div>
                    </div>
                </div>
                <div class="window"><i></i></div>
            </div>
            <div class="floor"><div class="window"><i></i></div><div class="window dark"><i></i></div><div class="window"><i></i></div></div>
            <div class="floor"><div class="window"><i></i></div><div class="window"><i></i></div><div class="window dark"><i></i></div></div>
            <div class="floor"><div class="window dark"><i></i></div><div class="window"><i></i></div><div class="window"><i></i></div></div>
            <div class="floor"><div class="window"><i></i></div><div class="window dark"><i></i></div><div class="window"><i></i></div></div>
            <div class="floor"><div class="window dark"><i></i></div><div class="window"><i></i></div><div class="window"><i></i></div></div>
            <div class="floor eighth">
                <div class="window"><i></i></div>
                <div class="window"><i></i></div>
                <div class="window"><i></i></div>
            </div>

            <div class="floor ninth">
                <div class="window"><i></i></div>
                <div class="window dark"><i></i></div>
                <div class="window"><i></i></div>
            </div>

            <div class="ground-floor">
                <div class="door">
                    <span class="door-window"></span>
                    <span class="door-panel"></span>
                    <span class="door-knob"></span>
                </div>
                <div class="shop-window"><i></i></div>
            </div>
        </div>

        <div class="street">
            <div class="road-lines"></div>
            <div class="boy" aria-label="A boy in the street waving">
                <div class="boy-head">
                    <span class="boy-hair"></span>
                    <i class="boy-eye left-eye"></i>
                    <i class="boy-eye right-eye"></i>
                    <b class="boy-smile"></b>
                </div>
                <div class="boy-neck"></div>
                <div class="boy-body"><span></span></div>
                <div class="boy-arm boy-arm-left"><div class="boy-hand"><i class="boy-finger"></i></div></div>
                <div class="boy-arm boy-arm-right"><div class="boy-hand"><i class="boy-finger finger-one"></i><i class="boy-finger finger-two"></i><i class="boy-finger finger-three"></i></div></div>
                <div class="boy-leg left-leg"></div>
                <div class="boy-leg right-leg"></div>
            </div>
            
        </div>

        <div class="lamp"><div class="lamp-top"></div><div class="lamp-post"></div><div class="lamp-base"></div></div>
    </main>
</body>
</html>
